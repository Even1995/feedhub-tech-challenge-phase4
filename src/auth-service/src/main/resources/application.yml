spring:
  application:
    name: auth-service
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

feedhub:
  security:
    jwt-secret: ${JWT_SECRET:feedhub-default-secret-change-me-in-production-0123456789}
  dynamodb:
    usuarios-table: ${USUARIOS_TABLE:usuarios}
    endpoint: ${DYNAMODB_ENDPOINT:}
  admin:
    email: ${ADMIN_EMAIL:admin@feedhub.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    nome: ${ADMIN_NOME:Administrador FeedHub}

logging:
  level:
    com.feedhub: INFO
